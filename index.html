<!doctype html>
<html lang="en" data-theme="light" data-size="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ComPrep 12</title>
  <meta name="description" content="Offline study companion for CBSE Class 12 Commerce with Maths.">
  <meta name="theme-color" content="#12515A">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ComPrep 12">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply theme + text size before first paint (same key as js/store.js).
    (function () {
      var t = 'system', s = 'm';
      try {
        var st = JSON.parse(localStorage.getItem('comprep12.state.v1') || '{}');
        if (st.settings) { t = st.settings.theme || t; s = st.settings.textSize || s; }
      } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-size', s);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <button class="icon-btn back" id="back-btn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand" id="brand">
        <img src="icons/icon-192.png" alt="" width="28" height="28">
        <span>ComPrep <b>12</b></span>
      </div>
      <h1 class="top-title" id="top-title" hidden></h1>
      <div class="top-actions" id="top-actions"></div>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <div class="page"><div class="loading" aria-label="Loading"><span></span><span></span><span></span></div></div>
  </main>

  <div id="hint-slot"></div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <div class="tabbar-in">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="#/search" data-tab="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Search</span>
      </a>
      <a href="#/saved" data-tab="saved">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.5-6.5 4.5v-16a1 1 0 0 1 1-1z"/></svg>
        <span>Saved</span>
      </a>
      <a href="#/progress" data-tab="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V13M10 20V8M16 20v-5M22 20H2"/></svg>
        <span>Progress</span>
      </a>
    </div>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-slot"></div>

  <noscript><p style="padding:24px">ComPrep 12 needs JavaScript to run.</p></noscript>
</body>
</html>
